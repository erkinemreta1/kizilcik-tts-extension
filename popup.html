<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #2b1013;
    background: #fff;
  }
  .card {
    width: 260px;
    padding: 16px;
    text-align: center;
    background: linear-gradient(180deg, #fff 0%, #fff5f6 100%);
  }
  .logo {
    width: 64px; height: 64px;
    image-rendering: -webkit-optimize-contrast;
    filter: drop-shadow(0 4px 8px rgba(150, 15, 30, .25));
  }
  .hi {
    margin: 8px 0 2px;
    font-size: 17px;
    font-weight: 700;
    color: #c1121f;
  }
  .msg {
    margin: 0 0 12px;
    color: #6b3a3f;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #e8f6ec;
    color: #1f7a3d;
    font-weight: 600;
    font-size: 12px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #27ae60;
    box-shadow: 0 0 0 0 rgba(39, 174, 96, .6);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(39, 174, 96, .55); }
    70%  { box-shadow: 0 0 0 7px rgba(39, 174, 96, 0); }
    100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
  }
  .foot {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #f1d6d9;
    color: #9a6b70;
    font-size: 11px;
  }
  .ver { font-weight: 700; color: #c1121f; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icons/icon-128.png" alt="Kızılcık">
    <div class="hi" id="hi">Merhaba!</div>
    <p class="msg">TTS yakalayıcı ayakta; demo sesini WAV olarak indiriyor.</p>
    <div class="status"><span class="dot"></span> çalışıyor</div>
    <div class="foot">Sürüm <span class="ver">v<span id="ver">–</span></span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
